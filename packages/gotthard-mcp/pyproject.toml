[project]
name = "gotthard-mcp"
version = "0.1.0"
description = "Gotthard local MCP servers: office-tools (xlsx/docx/pdf) and memory (memory.md, document index)"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "mcp==2.3.0",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "pypdf==6.21.2",
  "pdfplumber==0.11.10",
  "reportlab==5.1.0",
  "numpy==2.5.4",
]

[project.scripts]
gotthard-office = "gotthard_mcp.office:main"
gotthard-memory = "gotthard_mcp.memory:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gotthard_mcp"]
